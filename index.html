<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Threads 文字数チェッカー</title>
<meta name="description" content="Threadsの投稿文字数（上限500字）と冒頭1行目の文字数をリアルタイムでチェックできるツール">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101010" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #f6f6f4;
    --card: #ffffff;
    --text: #141414;
    --muted: #6b6b6b;
    --line: #e4e4e0;
    --accent: #141414;
    --ok: #1f8a4c;
    --warn: #c27a00;
    --over: #d0342c;
    --track: #ececea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e0e;
      --card: #181818;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --line: #2a2a2a;
      --accent: #f2f2f2;
      --ok: #4cc27f;
      --warn: #f0b33c;
      --over: #ff6b62;
      --track: #262626;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px calc(32px + env(safe-area-inset-bottom));
  }
  header h1 {
    font-size: 1.35rem;
    margin: 0 0 4px;
    letter-spacing: 0.01em;
  }
  header p { margin: 0 0 20px; color: var(--muted); font-size: 0.9rem; }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
    position: sticky;
    top: 0;
    z-index: 2;
    padding: 8px 0;
    background: var(--bg);
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .stat .label { font-size: 0.78rem; color: var(--muted); }
  .stat .value {
    font-size: 1.9rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .stat .value small { font-size: 0.85rem; font-weight: 500; color: var(--muted); }
  .stat .sub { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--track); border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .bar span { display: block; height: 100%; width: 0; background: var(--ok); transition: width .15s, background .15s; }

  .ok   { color: var(--ok); }
  .warn { color: var(--warn); }
  .over { color: var(--over); }

  textarea {
    width: 100%;
    min-height: 46vh;
    resize: vertical;
    padding: 14px;
    font: inherit;
    font-size: 16px; /* iOSのズーム防止 */
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }

  .actions { display: flex; gap: 10px; margin-top: 10px; }
  button {
    flex: 1;
    font: inherit;
    font-size: 0.95rem;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  button:active { transform: scale(0.98); }

  .preview {
    margin-top: 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
  }
  .preview h2 { font-size: 0.85rem; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  .preview p { margin: 0; white-space: pre-wrap; word-break: break-all; min-height: 1.6em; }
  .preview p.empty { color: var(--muted); }

  .notes { margin-top: 20px; font-size: 0.8rem; color: var(--muted); }
  .notes ul { padding-left: 1.2em; margin: 6px 0 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Threads 文字数チェッカー</h1>
    <p>投稿文を貼り付けると、文字数をリアルタイムで表示します。</p>
  </header>

  <section class="stats" aria-live="polite">
    <div class="stat">
      <div class="label">全体の文字数</div>
      <div class="value"><span id="total">0</span><small> / 500</small></div>
      <div class="sub" id="remain">残り 500 字</div>
      <div class="bar"><span id="totalBar"></span></div>
    </div>
    <div class="stat">
      <div class="label">冒頭1行目</div>
      <div class="value"><span id="first">0</span><small> 字</small></div>
      <div class="sub" id="lines">全 0 行</div>
    </div>
  </section>

  <label for="text" class="visually-hidden" style="position:absolute;left:-9999px">投稿テキスト</label>
  <textarea id="text" placeholder="ここに投稿文を貼り付け・入力してください"></textarea>

  <div class="actions">
    <button type="button" id="paste">貼り付け</button>
    <button type="button" id="copy" class="primary">コピー</button>
    <button type="button" id="clear">クリア</button>
  </div>

  <section class="preview">
    <h2>冒頭1行目のプレビュー</h2>
    <p id="firstLine" class="empty">（まだ入力がありません）</p>
  </section>

  <div class="notes">
    文字数のカウント方法
    <ul>
      <li>絵文字や結合文字は見た目どおり1文字として数えます。</li>
      <li>改行はカウントに含めません。</li>
      <li>入力内容はブラウザ内だけで処理され、どこにも送信されません。</li>
    </ul>
  </div>
</main>

<script>
  const LIMIT = 500;
  const $ = (id) => document.getElementById(id);
  const ta = $("text");

  const seg = (typeof Intl !== "undefined" && Intl.Segmenter)
    ? new Intl.Segmenter("ja", { granularity: "grapheme" })
    : null;

  function count(str) {
    const s = str.replace(/\r?\n/g, "");
    if (seg) { let n = 0; for (const _ of seg.segment(s)) n++; return n; }
    return Array.from(s).length;
  }

  function update() {
    const text = ta.value.replace(/\r\n/g, "\n");
    const total = count(text);
    const lines = text.split("\n");
    const firstLine = lines[0] || "";
    const firstCount = count(firstLine);

    $("total").textContent = total;
    const rest = LIMIT - total;
    const remain = $("remain");
    remain.textContent = rest >= 0 ? `残り ${rest} 字` : `${-rest} 字オーバー`;

    const ratio = total / LIMIT;
    const cls = ratio > 1 ? "over" : ratio >= 0.9 ? "warn" : "ok";
    $("total").className = total === 0 ? "" : cls;
    remain.className = "sub " + (cls === "ok" ? "" : cls);
    const bar = $("totalBar");
    bar.style.width = Math.min(ratio, 1) * 100 + "%";
    bar.style.background = `var(--${cls})`;

    $("first").textContent = firstCount;
    $("lines").textContent = `全 ${text === "" ? 0 : lines.length} 行`;

    const fl = $("firstLine");
    if (firstLine.trim() === "") {
      fl.textContent = text === "" ? "（まだ入力がありません）" : "（1行目が空です）";
      fl.classList.add("empty");
    } else {
      fl.textContent = firstLine;
      fl.classList.remove("empty");
    }
  }

  ta.addEventListener("input", update);

  $("clear").addEventListener("click", () => { ta.value = ""; update(); ta.focus(); });

  $("copy").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    try {
      await navigator.clipboard.writeText(ta.value);
      btn.textContent = "コピーしました";
    } catch {
      ta.select(); document.execCommand("copy");
      btn.textContent = "コピーしました";
    }
    setTimeout(() => (btn.textContent = "コピー"), 1500);
  });

  $("paste").addEventListener("click", async () => {
    try {
      const t = await navigator.clipboard.readText();
      ta.value = t; update();
    } catch {
      ta.focus();
      alert("ブラウザの制限で自動貼り付けできませんでした。入力欄を長押しして「ペースト」してください。");
    }
  });

  update();
</script>
</body>
</html>
